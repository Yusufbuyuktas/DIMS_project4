spring.application.name=proje-backend
server.port=8080

# PostgreSQL Balant Ayarlar
spring.datasource.url=jdbc:postgresql://localhost:5432/final_proje_db
spring.datasource.username=postgres
spring.datasource.password=ilikesql

# Hibernate/JPA Ayarlar (Tablolar otomatik oluturur)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Dosya Ykleme Snrlar (Resim ykleme iin lazm)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB